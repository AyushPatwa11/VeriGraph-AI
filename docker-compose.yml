services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verigraph-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FRONTEND_ORIGIN=http://localhost:3000
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # Persist the JSON file database & analyses outside container
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - verigraph-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    container_name: verigraph-frontend
    ports:
      - "3000:3000"
    environment:
      # Internal Docker network proxy target for Next.js route handlers
      - BACKEND_URL=http://backend:8000
      # Browser-facing target
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - verigraph-network

networks:
  verigraph-network:
    driver: bridge
